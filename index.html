<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCIS Camp</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937, #020617);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 85%;
      max-width: 900px;
      padding: 60px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 100px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      color: #7dd3fc;
      font-size: 14px;
      margin-bottom: 24px;
      border: 1px solid rgba(125,211,252,0.3);
    }

    h1 {
      font-size: clamp(42px, 8vw, 88px);
      margin: 0;
      letter-spacing: -3px;
    }

    .gradient {
      background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      color: transparent;
    }

    p {
      font-size: 22px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-top: 24px;
    }

    .buttons {
      margin-top: 36px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 15px 24px;
      border-radius: 16px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .primary {
      background: white;
      color: #020617;
      font-weight: 700;
    }

    .secondary {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    .footer {
      margin-top: 48px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">TCIS Official-ish Subdomain</div>

    <h1>
      Welcome to <span class="gradient">TCIS Camp</span>
    </h1>

    <p>
      A premium digital experience for students who opened the website
      instead of doing their homework.
    </p>

    <div class="buttons">
      <button class="primary" onclick="alert('Access denied. Please bring your homework first.')">
        Enter Campus
      </button>
      <button class="secondary" onclick="alert('You have been sent to detention.')">
        Secret Button
      </button>
    </div>

    <div class="footer">
      Powered by GitHub Pages · Designed with questionable academic integrity
    </div>
  </main>
</body>
</html>
