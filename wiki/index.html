<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="《剑拔弩张 Tension Point》百科档案库，收录游戏系统、资源、派系、事件与核心术语。"
    />
    <meta name="robots" content="index,follow" />
    <title>剑拔弩张 Wiki | Tension Point Archive</title>
    <link rel="canonical" href="https://tcis.gaschamber.online/wiki/" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="stylesheet" href="wiki.css" />
  </head>
  <body>
    <nav class="wiki-global-nav" aria-label="Wiki 导航">
      <a id="wikiHomeLink" class="wiki-home-link" href="/" aria-label="返回主页">
        <img src="../assets/学生阵营logo.png" alt="" />
      </a>
      <div class="wiki-nav-title">
        <span>TENSION POINT ARCHIVE</span>
        <strong id="wikiNavName">剑拔弩张百科</strong>
      </div>
    </nav>

    <main class="wiki-shell" aria-label="剑拔弩张百科">
      <aside class="wiki-sidebar">
        <header class="wiki-brand">
          <span>TP ARCHIVE</span>
          <h1 id="wikiBrandTitle">剑拔弩张 Wiki</h1>
          <p id="wikiBrandTagline">校园政治策略模拟档案库</p>
        </header>

        <label class="wiki-search">
          <span id="wikiSearchLabel">搜索档案</span>
          <input id="wikiSearch" type="search" placeholder="输入关键词..." autocomplete="off" />
        </label>

        <nav id="wikiCategoryList" class="wiki-categories" aria-label="百科分类"></nav>
      </aside>

        <section class="wiki-main">
          <div class="wiki-topline">
            <span id="wikiModeLabel">STANDALONE DATABASE</span>
            <label class="wiki-language" for="wikiLanguageSelect">
              <span id="wikiLanguageLabel">语言</span>
              <select id="wikiLanguageSelect">
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </label>
          </div>

        <article id="wikiArticle" class="wiki-article" aria-live="polite">
          <div class="wiki-empty">
            <span>SELECT ENTRY</span>
            <h2>选择左侧词条查看档案</h2>
            <p>这里会显示游戏术语、系统规则、派系资料和事件说明。</p>
          </div>
        </article>
      </section>
    </main>

    <script src="wiki.js"></script>
  </body>
</html>
